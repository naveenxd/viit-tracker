name: Build & release APKs

# How to trigger:
#   - push a version tag:   git tag v1.1.0 && git push origin v1.1.0
#     -> builds universal + per-ABI release APKs and publishes them on a
#        GitHub Release for that tag (release notes = in-app changelog).
#   - or run it manually from the Actions tab (workflow_dispatch) — uploads
#     the APKs as workflow artifacts instead of creating a release.
#
# Release signing (optional): add repository secrets
#   KEYSTORE_BAS64   (base64 of your .jks:  base64 -w0 path/to/release.jks)
#   KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
# Without them the workflow still builds, debug-signed (fine for testing only).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode release keystore (if secrets configured)
        env:
          KEYSTORE_BAS64: ${{ secrets.KEYSTORE_BAS64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BAS64" ]; then
            printf '%s' "$KEYSTORE_BAS64" | base64 -d > "$GITHUB_WORKSPACE/release.keystore"
            {
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyPassword=$KEY_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "storeFile=$GITHUB_WORKSPACE/release.keystore"
            } > androidApp/key.properties
            echo "Release keystore decoded."
          else
            echo "::warning::Keystore secrets not configured — APKs will be debug-signed."
          fi

      - name: Determine version name
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "name=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "name=1.0-dev.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build universal + split release APKs
        env:
          VERSION_NAME: ${{ steps.ver.outputs.name }}
          VERSION_CODE: ${{ github.run_number }}
          ENABLE_ABI_SPLITS: "true"
        run: ./gradlew :androidApp:assembleRelease

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ github.run_number }}
          path: androidApp/build/outputs/apk/release/*.apk

      - name: Publish GitHub Release with APKs + auto-generated notes
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: androidApp/build/outputs/apk/release/*.apk
