name: Build & release APKs / Play AAB

# How to trigger:
#   - push a version tag:   git tag v1.1.0 && git push origin v1.1.0
#     -> github job: builds universal + per-ABI release APKs, publishes them
#        on a GitHub Release, then updates version.json on main — the sideload
#        app's in-app updater reads that manifest via raw.githubusercontent.com
#        (CDN, no api rate limits; see tool/release/generate_version_json.py).
#     -> play job: builds a Play AAB artifact (no GitHub updater, no
#        REQUEST_INSTALL_PACKAGES) for manual upload to Play Console.
#   - or run it manually from the Actions tab (workflow_dispatch) — uploads
#     the APKs/AAB as workflow artifacts instead of creating a release.
#
# Release signing: add repository secrets
#   KEYSTORE_BAS64   (base64 of your .jks:  base64 -w0 path/to/release.jks)
#   KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
# Manual runs without them build debug-signed artifacts (testing only). Tag
# runs fail on purpose rather than publishing an unupdatable release.
#
# Optional: changelog/<version>.md — bullets shown in the in-app update sheet
# and the post-update "What's new" sheet (falls back to "Release <version>" when
# missing).
#
# Optional analytics: ANALYTICS_KEY (and optionally ANALYTICS_URL) repository
# secrets. Without them the app builds normally and the pinger stays disabled.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history + tags so release notes can find the previous tag and
          # emit a compare link.
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode release keystore (if secrets configured)
        env:
          KEYSTORE_BAS64: ${{ secrets.KEYSTORE_BAS64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BAS64" ]; then
            printf '%s' "$KEYSTORE_BAS64" | base64 -d > "$GITHUB_WORKSPACE/release.keystore"
            {
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyPassword=$KEY_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "storeFile=$GITHUB_WORKSPACE/release.keystore"
            } > androidApp/key.properties
            echo "Release keystore decoded."
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            # A debug-signed "release" locks the app's update signature to the
            # debug key: every future properly-signed build would be rejected
            # as an update. Fail instead of publishing one.
            echo "::error::Keystore secrets missing — refusing to publish a debug-signed release."
            exit 1
          else
            echo "::warning::Keystore secrets not configured — APKs will be debug-signed."
          fi

      - name: Determine version name
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "name=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "name=1.0-dev.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build universal + split release APKs
        env:
          VERSION_NAME: ${{ steps.ver.outputs.name }}
          VERSION_CODE: ${{ github.run_number }}
          ENABLE_ABI_SPLITS: "true"
          ANALYTICS_URL: ${{ secrets.ANALYTICS_URL }}
          ANALYTICS_KEY: ${{ secrets.ANALYTICS_KEY }}
        run: ./gradlew :androidApp:assembleGithubRelease

      - name: Rename APKs to release naming
        id: naming
        run: |
          set -euo pipefail
          VERSION="${{ steps.ver.outputs.name }}"
          OUT=androidApp/build/outputs/apk/github/release
          mv "$OUT/androidApp-github-universal-release.apk" "$OUT/viit-tracker-$VERSION.apk"
          for abi in arm64-v8a armeabi-v7a x86_64; do
            if [ -f "$OUT/androidApp-github-$abi-release.apk" ]; then
              mv "$OUT/androidApp-github-$abi-release.apk" "$OUT/viit-tracker-$VERSION-$abi.apk"
            fi
          done
          ls -lh "$OUT"/*.apk

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ github.run_number }}
          path: androidApp/build/outputs/apk/github/release/*.apk

      - name: Compose release notes
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          VERSION="${{ steps.ver.outputs.name }}"
          TAG="${{ github.ref_name }}"
          CHANGELOG="changelog/$VERSION.md"

          {
            if [ -s "$CHANGELOG" ]; then
              cat "$CHANGELOG"
            else
              echo "Release $VERSION"
            fi
            echo

            PREV_TAG=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)
            if [ -n "$PREV_TAG" ]; then
              echo "**Full Changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${PREV_TAG}...${TAG}"
            else
              echo "**Full Changelog**: https://github.com/${GITHUB_REPOSITORY}/commits/${TAG}"
            fi
          } > release-notes.md

          cat release-notes.md

      - name: Publish GitHub Release with APKs
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: androidApp/build/outputs/apk/github/release/*.apk

      # The updater's manifest: version.json on main, fetched by the app via
      # raw.githubusercontent.com. Runs AFTER the asset publish so the APK
      # URLs in the manifest already resolve.
      - name: Generate version.json and push to main
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.ver.outputs.name }}"
          TAG="${{ github.ref_name }}"
          OUT=androidApp/build/outputs/apk/github/release

          rm -rf /tmp/tracker-releases
          git clone --depth 1 \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            /tmp/tracker-releases

          SPLIT_ARGS=()
          for abi in arm64-v8a armeabi-v7a x86_64; do
            [ -f "$OUT/viit-tracker-$VERSION-$abi.apk" ] && \
              SPLIT_ARGS+=(--split "$abi=$OUT/viit-tracker-$VERSION-$abi.apk")
          done

          python3 "$GITHUB_WORKSPACE/tool/release/generate_version_json.py" \
            --tag "$TAG" \
            --universal-apk "$OUT/viit-tracker-$VERSION.apk" \
            "${SPLIT_ARGS[@]}" \
            --changelog "$GITHUB_WORKSPACE/changelog/$VERSION.md" \
            --existing /tmp/tracker-releases/version.json \
            --out /tmp/tracker-releases/version.json

          cd /tmp/tracker-releases
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version.json
          if git diff --cached --quiet; then
            echo "version.json unchanged — nothing to push."
          else
            git commit -m "release $TAG: update version.json"
            git push
          fi

  # Play distribution is a separate compile-time flavor. It deliberately has
  # no GitHub updater code, no FileProvider and no REQUEST_INSTALL_PACKAGES.
  # This job only builds/upload the AAB artifact; uploading to Play Console is
  # manual until a service-account publishing step is added.
  play-bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode upload keystore (if secrets configured)
        env:
          KEYSTORE_BAS64: ${{ secrets.KEYSTORE_BAS64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BAS64" ]; then
            printf '%s' "$KEYSTORE_BAS64" | base64 -d > "$GITHUB_WORKSPACE/release.keystore"
            {
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyPassword=$KEY_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "storeFile=$GITHUB_WORKSPACE/release.keystore"
            } > androidApp/key.properties
            echo "Release keystore decoded."
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "::error::Keystore secrets missing — refusing to build an unsigned Play AAB."
            exit 1
          else
            echo "::warning::Keystore secrets not configured — AAB will be debug-signed."
          fi

      - name: Determine version name
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "name=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "name=1.0-dev.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Play AAB
        env:
          VERSION_NAME: ${{ steps.ver.outputs.name }}
          VERSION_CODE: ${{ github.run_number }}
          ANALYTICS_URL: ${{ secrets.ANALYTICS_URL }}
          ANALYTICS_KEY: ${{ secrets.ANALYTICS_KEY }}
        run: ./gradlew :androidApp:bundlePlayRelease

      - name: Verify Play manifest has no self-update permission
        run: |
          set -euo pipefail
          MANIFEST=$(find androidApp/build/intermediates/bundle_manifest/playRelease \
            -name AndroidManifest.xml | head -n 1)
          if [ -z "$MANIFEST" ]; then
            echo "::error::Play merged manifest not found."
            exit 1
          fi
          if grep -q 'REQUEST_INSTALL_PACKAGES' "$MANIFEST"; then
            echo "::error::Play build contains REQUEST_INSTALL_PACKAGES."
            exit 1
          fi
          echo "Play manifest is clean: no REQUEST_INSTALL_PACKAGES."

      - name: Upload Play AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: aab-${{ github.run_number }}
          path: androidApp/build/outputs/bundle/playRelease/*.aab
